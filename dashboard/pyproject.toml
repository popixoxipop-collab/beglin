[project]
name = "beglin-experiment-dashboard"
version = "0.1.0"
description = "Contract-first observability backend for Beglin local quantization experiments"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0,<1.0.0",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
