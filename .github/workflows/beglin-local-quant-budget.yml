name: beglin-local-quant-budget

on:
  push:
    branches:
      - research/local-quant-budget-20261017
    paths:
      - 'tools/quant_sim_n.py'
      - 'qng64_dense.c'
      - 'qng64_dense.h'
      - 'tests/test_qng64_dense_contract.c'
      - 'benchmarks/qng64_uniform_mixed_microbench.c'
      - 'benchmarks/qng64_native_output_calibration.c'
      - 'tools/qng64_storage.py'
      - 'tools/precision_budget_*.py'
      - 'tools/test_precision_budget_*.py'
      - '.github/workflows/beglin-local-quant-budget.yml'
  pull_request:
    paths:
      - 'tools/quant_sim_n.py'
      - 'qng64_dense.c'
      - 'qng64_dense.h'
      - 'tests/test_qng64_dense_contract.c'
      - 'benchmarks/qng64_uniform_mixed_microbench.c'
      - 'benchmarks/qng64_native_output_calibration.c'
      - 'tools/qng64_storage.py'
      - 'tools/precision_budget_*.py'
      - 'tools/test_precision_budget_*.py'
      - '.github/workflows/beglin-local-quant-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-algorithm:
    name: "offline ${{ matrix.os }} / Python ${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax-check engine research tools
        run: |
          python -m py_compile tools/quant_sim_n.py tools/qng64_storage.py \
            tools/precision_budget_search.py tools/precision_budget_collect.py \
            tools/precision_budget_fixture.py tools/test_precision_budget_search.py \
            tools/test_precision_budget_collect.py
      - name: Real BEGLIN qng64_dense.c CPU encode/decode/GEMV contract
        shell: bash
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -I. \
            qng64_dense.c tests/test_qng64_dense_contract.c -lm \
            -o "$RUNNER_TEMP/beglin_qng64_dense_contract"
          "$RUNNER_TEMP/beglin_qng64_dense_contract"
      - name: Actual native CPU qNg64 GEMV uniform-vs-mixed microbenchmark
        shell: bash
        run: |
          cc -std=c11 -O3 -Wall -Wextra -Werror -I. \
            qng64_dense.c benchmarks/qng64_uniform_mixed_microbench.c -lm \
            -o "$RUNNER_TEMP/beglin_qng64_mixed_microbench"
          "$RUNNER_TEMP/beglin_qng64_mixed_microbench"
      - name: Native C output-error calibration to optimized role-level policy
        shell: bash
        run: |
          cc -std=c11 -O3 -Wall -Wextra -Werror -I. \
            qng64_dense.c benchmarks/qng64_native_output_calibration.c -lm \
            -o "$RUNNER_TEMP/beglin_qng64_native_calibration"
          "$RUNNER_TEMP/beglin_qng64_native_calibration" > "$RUNNER_TEMP/beglin_native_cpu_profile.json"
          python tools/precision_budget_search.py \
            --input "$RUNNER_TEMP/beglin_native_cpu_profile.json" \
            --output "$RUNNER_TEMP/beglin_native_cpu_policy.json"
          python - "$RUNNER_TEMP/beglin_native_cpu_policy.json" "$RUNNER_TEMP/beglin_qng64_mixed_microbench" <<'PY'
          import json, subprocess, sys
          policy=json.load(open(sys.argv[1], encoding="utf-8"))
          assert policy["mode"] == "OFFLINE_RESEARCH_ONLY_NOT_QUALIFIED_FOR_LIVE"
          assert policy["quality_validated"] is False
          assert policy["automatic_live_promotion"] is False
          n=[str(s["n"]) for s in policy["selections"]]
          assert len(n)==6, n
          run=subprocess.run([sys.argv[2],*n],capture_output=True,text=True,check=True)
          print(run.stdout)
          rows=[json.loads(x) for x in run.stdout.strip().splitlines()]
          ref=next(x for x in rows if x.get("arm")=="uniform_n7")
          actual=next(x for x in rows if x.get("arm")=="native_output_calibrated")
          assert actual["serialized_weight_bytes"]<=ref["serialized_weight_bytes"]
          # Per-role native GEMV output SSE is the planner's additive objective,
          # unlike the earlier arbitrary weight-L2 sensitivity proxy.
          assert actual["dense_fp32_output_rel_l2"] <= ref["dense_fp32_output_rel_l2"]*1.00001
          assert rows[-1]["automatic_live_promotion"] is False
          print("BEGLIN_NATIVE_OUTPUT_CALIBRATION_CLOSED_LOOP_PASS", ",".join(n))
          PY
      - name: qNg64 per-tensor algorithm regressions (synthetic only)
        run: python -m unittest discover -s tools -p 'test_precision_budget*.py' -v
      - name: Generate and solve synthetic CPU + Metal capability plans
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/beglin-quant-ci"
          for backend in cpu mlx_metal; do
            python tools/precision_budget_fixture.py \
              --backend "$backend" --budget-frac 0.5 \
              --output "$RUNNER_TEMP/beglin-quant-ci/$backend-profile.json"
            python tools/precision_budget_search.py \
              --input "$RUNNER_TEMP/beglin-quant-ci/$backend-profile.json" \
              --output "$RUNNER_TEMP/beglin-quant-ci/$backend-policy.json"
            python - "$RUNNER_TEMP/beglin-quant-ci/$backend-policy.json" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          assert doc["mode"] == "OFFLINE_RESEARCH_ONLY_NOT_QUALIFIED_FOR_LIVE"
          assert doc["automatic_live_promotion"] is False
          assert doc["quality_validated"] is False
          assert doc["latency_measured"] is False
          assert doc["gpu_resident_memory_measured"] is False
          assert doc["serialized_qng64_weight_bytes"] <= doc["budget_bytes"]
          print(doc["backend"], doc["serialized_qng64_weight_bytes"],
                doc["weighted_relative_l2_squared_proxy"])
          PY
          done
