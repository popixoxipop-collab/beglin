name: Q/T Heatmap Regression

on:
  push:
    branches:
      - "qt-heatmap-*"
      - "qt-selective-training-*"
    paths:
      - "schemas/heatmap/**"
      - "tools/qt_heatmap.py"
      - "tools/qt_beval.py"
      - "tools/qt_qwen25_group_perturb.py"
      - "tools/qt_selective_training.py"
      - "tools/test_qt_selective_training.py"
      - "tools/verify_qt_heatmap_contracts.py"
      - "tools/test_qt_heatmap.py"
      - "tools/test_qt_beval.py"
      - "tools/test_qt_qwen25_group_perturb.py"
      - ".github/workflows/qt-heatmap-regression.yml"
  pull_request:
    paths:
      - "schemas/heatmap/**"
      - "tools/qt_heatmap.py"
      - "tools/qt_beval.py"
      - "tools/qt_qwen25_group_perturb.py"
      - "tools/verify_qt_heatmap_contracts.py"
      - "tools/test_qt_heatmap.py"
      - "tools/test_qt_beval.py"
      - "tools/test_qt_qwen25_group_perturb.py"
      - ".github/workflows/qt-heatmap-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt-heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Q/T BSKEL contracts
        run: python3 tools/verify_qt_heatmap_contracts.py
      - name: Run deterministic Q/T projector tests
        run: python3 tools/test_qt_heatmap.py
      - name: Run Q/T BEVAL fail-closed tests
        run: python3 tools/test_qt_beval.py
      - name: Run Qwen group perturbation tests
        run: python3 tools/test_qt_qwen25_group_perturb.py
      - name: Run selective training primitive tests
        run: python3 tools/test_qt_selective_training.py
