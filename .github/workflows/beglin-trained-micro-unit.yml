name: Beglin Trainable Micro Router Unit
on:
  push:
    branches: [research/trainable-micro-router-20261013]
    paths: [".github/workflows/beglin-trained-micro-unit.yml"]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - run: python -m unittest discover -s experiments/hierarchical_tupper_moe -p test_trainable_micro_router.py -v
