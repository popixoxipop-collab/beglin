name: Tailnet BEGLIN runner hook smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailnet-beglin-runner-hook-smoke
  cancel-in-progress: false

jobs:
  verify-runner:
    runs-on: [self-hosted, xox, macOS, ARM64, virtual-character]
    timeout-minutes: 2
    steps:
      - name: Verify exact XOX runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "XOX.local"
          test "$(id -un)" = "xox"
          printf '%s\n' 'TAILNET_BEGLIN_RUNNER_HOOK_SMOKE_PASS'
