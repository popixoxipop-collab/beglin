name: Beglin HCP P3 True TopK Boundary Unit
on:
  push:
    branches: [research/hcp-p3-true-topk-margin-20261014]
    paths:
      - ".github/workflows/hcp-p3-true-boundary-unit.yml"
      - "tools/hcp_p3_router_instrument.py"
      - "tools/hcp_p3_boundary_features.py"
      - "tools/hcp_p3_real_capture.py"
      - "tools/hcp_p3_true_boundary_eval.py"
      - "tools/test_hcp_p3_true_boundary.py"
      - "tools/hcp_p3_quality_gate.py"
      - "tools/test_hcp_p3_quality_gate.py"
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - name: Test true rank6/7 hook and frozen causal multiscale risk predictor
        shell: bash
        run: |
          set -euo pipefail
          cd tools
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 python -m unittest test_hcp_p3_true_boundary.py test_hcp_p3_quality_gate.py test_hcp_p2_multiscale.py test_hcp_p2_policy_guard.py -v
          echo P3_ROUTER_BOUNDARY_UNIT_PASS
