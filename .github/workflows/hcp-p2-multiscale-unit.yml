name: Beglin HCP P2 Slow Fast Latent Unit
on:
  push:
    branches: [research/hierarchical-compute-planner-p2-20261014]
    paths:
      - ".github/workflows/hcp-p2-multiscale-unit.yml"
      - "tools/hcp_p2_policy_guard.py"
      - "tools/test_hcp_p2_policy_guard.py"
      - "tools/test_hcp_p2_real_feature_builder.py"
      - "tools/hcp_p2_complexity_gate.py"
      - "tools/test_hcp_p2_complexity_gate.py"
      - "experiments/hcp_p2/observed_120prompt_proxy_summary_20261014.json"
      - "tools/hcp_p2_multiscale.py"
      - "tools/test_hcp_p2_multiscale.py"
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Validate offline latent, split and real-source contracts
        shell: bash
        run: |
          set -euo pipefail
          PY=python3
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 "$PY" -m py_compile tools/hcp_p2_real_feature_builder.py tools/hcp_p2_multiscale.py
          cd tools
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 "$PY" -m unittest test_hcp_p2_multiscale.py test_hcp_p2_policy_guard.py test_hcp_p2_real_feature_builder.py test_hcp_p2_complexity_gate.py -v
          echo "HCP_P2_SPLIT_AND_LATENT_UNIT_PASS"
