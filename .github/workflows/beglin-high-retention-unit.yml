name: Beglin High Retention Strict Gate Unit
on:
  push:
    branches: [research/micro-retention-90-95-99-20261014]
    paths: [".github/workflows/beglin-high-retention-unit.yml"]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - name: Verify fail-closed discrete-count gate and result parsing
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/hierarchical_tupper_moe
          python -m unittest test_high_retention_gate.py test_prompt_holdout_micro_eval.py -v
