name: gpu-precision-g1-g3

on:
  push:
    branches: [gpu-precision-g1-g3]
  pull_request:
    branches: [gpu-precision-g0, main]

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python control plane
        run: |
          python -m py_compile \
            d4_supabase_push.py \
            tools/autopilot_live_preflight.py \
            tools/backend_capabilities.py \
            tools/precision_context.py \
            tools/backend_adapters.py \
            tools/precision_transactions.py \
            tools/precision_evidence_v3.py \
            tools/precision_planner_v3.py \
            tools/precision_control_state.py \
            tools/autopilot_observer_v3.py \
            tools/autopilot_preflight_v3.py \
            tools/model_capability.py \
            tools/backend_adapter_v2.py \
            tools/backend_runtime_probe_p12.py \
            tools/model_source_inspector.py \
            tools/architecture_registry.py \
            tools/tokenizer_registry.py \
            tools/loader_registry.py \
            tools/tensor_role_mapper.py \
            tools/capability_compiler_p12.py \
            tools/precision_p12_pipeline_bridge.py \
            tools/inspect_model.py \
            tools/verify_p12_bskel.py \
            tools/test_model_capability_p12.py \
            tools/test_p12_architecture_registry.py \
            tools/test_p12_tensor_role_mapper.py \
            tools/test_p12_capability_compiler.py \
            tools/test_p12_arch_semantics.py \
            tools/test_p12_backend_runtime_probe.py \
            tools/test_precision_p12_pipeline_bridge.py \
            tools/test_d4_supabase_push.py \
            tools/test_autopilot_live_preflight.py \
            tools/test_backend_capabilities.py \
            tools/test_gpu_binding_source_guards.py \
            tools/test_precision_transactions.py \
            tools/test_precision_evidence_v3.py \
            tools/test_precision_planner_v3.py \
            tools/test_precision_control_state.py \
            tools/test_autopilot_observer_v3.py \
            tools/test_autopilot_preflight_v3.py
      - name: G0 safety tests
        run: |
          PYTHONPATH=. python tools/test_d4_supabase_push.py
          PYTHONPATH=tools python tools/test_autopilot_live_preflight.py
          PYTHONPATH=tools python tools/test_backend_capabilities.py
          PYTHONPATH=tools python tools/test_gpu_binding_source_guards.py
      - name: G1 context evidence planner tests
        run: |
          PYTHONPATH=tools python tools/test_precision_evidence_v3.py
          PYTHONPATH=tools python tools/test_precision_planner_v3.py
      - name: G2 G3 transaction and control-state tests
        run: |
          PYTHONPATH=tools python tools/test_precision_transactions.py
          PYTHONPATH=tools python tools/test_precision_control_state.py
      - name: G4 mock preflight tests
        run: |
          PYTHONPATH=tools python tools/test_autopilot_preflight_v3.py
      - name: G5 observer semantics tests
        run: |
          PYTHONPATH=tools python tools/test_autopilot_observer_v3.py

      - name: P12 model capability contract tests
        run: |
          PYTHONPATH=tools python tools/test_model_capability_p12.py
          PYTHONPATH=tools python tools/test_p12_architecture_registry.py
          PYTHONPATH=tools python tools/test_p12_tensor_role_mapper.py
          PYTHONPATH=tools python tools/test_p12_capability_compiler.py
          PYTHONPATH=tools python tools/test_p12_arch_semantics.py
          PYTHONPATH=tools python tools/test_p12_backend_runtime_probe.py
          PYTHONPATH=tools python tools/test_precision_p12_pipeline_bridge.py
          PYTHONPATH=tools python tools/verify_p12_bskel.py
