name: Beglin HCP P5 36 Real Risk Matched Shadow Native qNg64 AB
on:
  push:
    branches: [research/hcp-p5-isolated-rebind-capacity-20261014]
    paths:
      - ".github/workflows/hcp-p5-xox-shadow-36-real-router-action-ab.yml"
      - "tools/hcp_p5_native_long128_shadow.py"
permissions:
  contents: read
  actions: read
concurrency:
  group: beglin-hcp-p5-36-real-risk-native
  cancel-in-progress: false
jobs:
  shadow-cap128:
    runs-on: [self-hosted, xox, macOS, ARM64, virtual-character]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1b4606eef596e10f3003f7d9f07b607616e990d6
          path: frozen_prompt_source
          persist-credentials: false
      - name: Verify original stage, context-specific memory budget, immutable route and scratch source
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = XOX.local && test "$(id -un)" = xox
          SCRATCH="$RUNNER_TEMP/hcp-p5-risk36-$GITHUB_RUN_ID"
          test ! -e "$SCRATCH"
          mkdir -p "$SCRATCH/src" "$SCRATCH/upload"
          echo "SCRATCH=$SCRATCH" >> "$GITHUB_ENV"
          export SCRATCH
          /Users/xox/.venv-vllm-metal/bin/python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,sys,shutil
          sys.path.insert(0,str(pathlib.Path("tools").resolve()))
          import production_serving_supervisor_persistent as ps
          assert ps.EXPECTED_PERSISTENT_SOURCE_SHA=="8b46cdd38f5b39dcaeaa9d1c5dfbd9642601a30a"
          stage=pathlib.Path(ps.PERSISTENT_BINARY)
          stage_sha=hashlib.sha256(stage.read_bytes()).hexdigest()
          assert stage_sha==ps.EXPECTED_PERSISTENT_BINARY_SHA
          phys=int(subprocess.check_output(["/usr/sbin/sysctl","-n","hw.memsize"],text=True).strip())
          if phys<48*1024**3:raise RuntimeError("KV128 research model requires 48GiB total memory minimum")
          mem=subprocess.check_output(["/usr/bin/vm_stat"],text=True)
          size=int(re.search(r"page size of (\d+) bytes",mem).group(1))
          pages={}
          for line in mem.splitlines():
              match=re.search(r"^(Pages free|Pages inactive|Pages speculative):\s+(\d+)\.",line)
              if match:pages[match.group(1)]=int(match.group(2))
          free=(sum(pages.values())*size)
          if free<8*1024**3:raise RuntimeError("KV128 scratch VM free+inactive+speculative less than 8GiB")
          if shutil.disk_usage(os.environ["RUNNER_TEMP"]).free<5*1024**3:
              raise RuntimeError("KV128 scratch disk below 5GiB")
          route=pathlib.Path("/Users/xox/vdsp_serving/active-route.json")
          receipt={"schema":"beglin-hcp-p5-kv128-preflight-v1",
            "old_stage_sha256":stage_sha,
            "route_sha256":hashlib.sha256(route.read_bytes()).hexdigest() if route.is_file() else None,
            "RAM_bytes":phys,"vm_available_bytes":free,
            "source_head":os.environ["GITHUB_SHA"],
            "production_touched":False}
          (pathlib.Path(os.environ["SCRATCH"])/"before.json").write_text(json.dumps(receipt,sort_keys=True)+"\n")
          print("P5_SCRATCH_KV128_MEMORY_STAGE_PREFLIGHT_PASS",json.dumps({
             "total_gib":round(phys/1024**3,1),"free_inactive_gib":round(free/1024**3,1),
             "old_stage_untouched":True},sort_keys=True))
          PY
          rsync -a --exclude=.git --exclude=.github --exclude=frozen_prompt_source --exclude=results --exclude=attestations --exclude=build --exclude=build-persistent ./ "$SCRATCH/src/"
      - name: Patch BOTH scratch C cbatch128 and MLX GPU MLA/GQA positional cache128
        shell: bash
        run: |
          set -euo pipefail
          /Users/xox/.venv-vllm-metal/bin/python3 tools/hcp_p5_scratch_128_patch.py --scratch-src "$SCRATCH/src"
          grep -q '#define MOE_CBATCH_MAXPOS 128' "$SCRATCH/src/qwen_infer.c"
          grep -q '#define MLA_L0_MAXPOS 128' "$SCRATCH/src/mlx_moe.cpp"
          grep -q '#define GQA_L0_MAXPOS 128' "$SCRATCH/src/mlx_moe.cpp"
          echo P5_C_AND_MLX_128_POSITION_LIMITS_MATCH
          cmake -S "$SCRATCH/src" -B "$SCRATCH/build" -DCMAKE_BUILD_TYPE=Release -DMLX_CMAKE_DIR=/Users/xox/.venv-vllm-metal/lib/python3.12/site-packages/mlx/share/cmake
          nice -n 10 cmake --build "$SCRATCH/build" --target qwen_infer_gpu -j2
          shasum -a 256 "$SCRATCH/build/qwen_infer_gpu"
      - name: Download exact XOX 3933-token original P4 26-layer risk dataset
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 11852505311
          run-id: 38467501959
          repository: popixoxipop-collab/beglin
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/hcp-p5-risk36-${{ github.run_id }}/risk
      - name: Real 36 matched long contexts, two native qNg64 policies, risk source hash
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 nice -n 10 /Users/xox/.venv-vllm-metal/bin/python3 tools/hcp_p5_shadow_36risk_action_ab.py \
            --binary "$SCRATCH/build/qwen_infer_gpu" --source "$SCRATCH/src/qwen_infer.c" \
            --bank frozen_prompt_source/experiments/hierarchical_tupper_moe/prompt_bank \
            --tokenizer /Users/xox/vdsp_local_data/deepseek_v2lite_bf16_safetensors \
            --index /Users/xox/vdsp_local_data/deepseek_v2lite_bf16_safetensors/model.safetensors.index.json \
            --model-root /Users/xox/vdsp_local_data/moe_base_deepseek \
            --risk "$SCRATCH/risk/p4_derived_long_features.json" \
            --owner "$SCRATCH" --output "$SCRATCH/upload/p5_real_risk36_native_ab.json"
      - name: Seal full 36-prompt paired native risk/cost receipt, no promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /Users/xox/.venv-vllm-metal/bin/python3 - <<'PY'
          import os,pathlib,hashlib,json,sys
          sys.path.insert(0,str(pathlib.Path("tools").resolve()))
          import production_serving_supervisor_persistent as ps
          base=pathlib.Path(os.environ["RUNNER_TEMP"])/("hcp-p5-risk36-"+os.environ["GITHUB_RUN_ID"])
          if not (base/"before.json").is_file():
              print("P5_RISK36_MISSING_PRECHECK");raise SystemExit(0)
          old=json.loads((base/"before.json").read_text())
          stage_sha=hashlib.sha256(pathlib.Path(ps.PERSISTENT_BINARY).read_bytes()).hexdigest()
          route=pathlib.Path("/Users/xox/vdsp_serving/active-route.json")
          route_sha=hashlib.sha256(route.read_bytes()).hexdigest() if route.is_file() else None
          stage_ok=stage_sha==old["old_stage_sha256"]
          route_ok=route_sha==old["route_sha256"]
          result_path=base/"upload/p5_real_risk36_native_ab.json"
          result=json.loads(result_path.read_text()) if result_path.is_file() else {}
          done=bool(result.get("schema")=="beglin-hcp-p5-36-real-risk-matched-native-policy-pairs-v1"
               and result.get("status")=="REAL_36_CONTEXT_NATIVE_QNG64_POLICY_A_B_SHADOW_ONLY"
               and result.get("original_input_count")==36
               and result.get("original_input_positions")==3933
               and result.get("native_policy_change_production_allowed") is False
               and result.get("production_touched") is False and stage_ok and route_ok)
          report={"schema":"beglin-hcp-p5-36-context-action-cost-receipt-v1",
             "status":"REAL_36_ORIGINAL_CONTEXT_NATIVE_A_B_PASS_RESEARCH_ONLY" if done else "BLOCKED_INCOMPLETE_NATIVE_COMPARISON",
             "source_head":old["source_head"],"original_P4_risk_sha256":
                 "c3b54b1ebe41d9a85ed94ddd0da87cde0de86ecf0af56d2e621733e439944f53",
             "p4_real_prompt_count":36,"original_token_positions":3933,
             "shadow_binary_sha256":hashlib.sha256((base/"build/qwen_infer_gpu").read_bytes()).hexdigest()
                                    if (base/"build/qwen_infer_gpu").is_file() else None,
             "native_ab_sha256":hashlib.sha256(result_path.read_bytes()).hexdigest() if done else None,
             "old_stage_untouched":stage_ok,"live_route_untouched":route_ok,
             "complete_matched_risk_and_action_cost":done,
             "native_task_correctness_verified":False,"same_quant_reference_logits_verified":False,
             "production_touched":False,"automatic_live_promotion":False}
          (base/"upload/receipt.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print("P5_MATCHED_36_NATIVE_RISK_COST_RECEIPT",json.dumps(report,sort_keys=True))
          assert stage_ok and route_ok
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beglin-hcp-p5-36-original-risk-native-qng64-action-ab
          path: ${{ runner.temp }}/hcp-p5-risk36-${{ github.run_id }}/upload/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Clean only P5-owned KV128 research C, binary, AF logits and native queues
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /Users/xox/.venv-vllm-metal/bin/python3 - <<'PY'
          import os,pathlib,shutil
          runner=pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()
          owned=runner/("hcp-p5-risk36-"+os.environ["GITHUB_RUN_ID"])
          if owned.is_dir() and owned.resolve().parent==runner:
              shutil.rmtree(owned)
              print("P5_KV128_OWN_SCRATCH_REMOVED")
          PY
