name: QT Mixed qNg64 MLX Probe

concurrency:
  group: qt-mixed-qng64-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "qt-heatmap-*"
    paths:
      - "mlx_moe.cpp"
      - "mlx_moe.h"
      - "tools/qt_mixed_qng64_mlx_probe.cpp"
      - "tools/qt_mixed_qng64_binding_probe.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/qt-mixed-qng64-mlx-probe.yml"
  pull_request:
    paths:
      - "mlx_moe.cpp"
      - "mlx_moe.h"
      - "tools/qt_mixed_qng64_mlx_probe.cpp"
      - "tools/qt_mixed_qng64_binding_probe.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/qt-mixed-qng64-mlx-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mixed-qng64-probe:
    runs-on: [self-hosted, xox, macOS, ARM64, virtual-character]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated XOX runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "XOX.local"
          test "$(id -un)" = "xox"
      - name: Build mixed qNg64 MLX probes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-qt-mixed-qng64
          cmake -S . -B build-qt-mixed-qng64 -DCMAKE_BUILD_TYPE=Release \
            -DMLX_CMAKE_DIR=/Users/xox/.venv-vllm-metal/lib/python3.12/site-packages/mlx/share/cmake
          cmake --build build-qt-mixed-qng64 --target \
            qt_mixed_qng64_mlx_probe qt_mixed_qng64_binding_probe -j4
      - name: Run CPU oracle vs mixed Metal matvec
        shell: bash
        run: |
          set -euo pipefail
          ./build-qt-mixed-qng64/qt_mixed_qng64_mlx_probe | tee /tmp/qt-mixed-qng64-mlx.txt
          grep -q '"status":"PASS"' /tmp/qt-mixed-qng64-mlx.txt
      - name: Run mixed binding snapshot rollback
        shell: bash
        run: |
          set -euo pipefail
          ./build-qt-mixed-qng64/qt_mixed_qng64_binding_probe | tee /tmp/qt-mixed-qng64-binding.txt
          grep -q '"status":"PASS"' /tmp/qt-mixed-qng64-binding.txt
      - name: Seal isolated evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          direct_binary=pathlib.Path("build-qt-mixed-qng64/qt_mixed_qng64_mlx_probe")
          binding_binary=pathlib.Path("build-qt-mixed-qng64/qt_mixed_qng64_binding_probe")
          direct=json.loads(pathlib.Path("/tmp/qt-mixed-qng64-mlx.txt").read_text().splitlines()[-1])
          binding=json.loads(pathlib.Path("/tmp/qt-mixed-qng64-binding.txt").read_text().splitlines()[-1])
          out={
            "schema":"beglin-qt-mixed-qng64-mlx-probe-evidence-v2",
            "status":"PASS" if direct["status"]=="PASS" and binding["status"]=="PASS" else "FAIL",
            "source_head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "direct_binary_sha256":hashlib.sha256(direct_binary.read_bytes()).hexdigest(),
            "binding_binary_sha256":hashlib.sha256(binding_binary.read_bytes()).hexdigest(),
            "direct_probe":direct,
            "binding_probe":binding,
            "probe_registry_transition_exercised":True,
            "production_touched":False,
            "production_write_allowed":False,
            "automatic_live_promotion":False,
          }
          p=pathlib.Path("/tmp/BEGLIN_QT_MIXED_QNG64_MLX_EVIDENCE.json")
          p.write_text(json.dumps(out,sort_keys=True,indent=2)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qt-mixed-qng64-mlx-probe-evidence
          path: |
            /tmp/BEGLIN_QT_MIXED_QNG64_MLX_EVIDENCE.json
            /tmp/qt-mixed-qng64-mlx.txt
            /tmp/qt-mixed-qng64-binding.txt
          if-no-files-found: error
          retention-days: 90
