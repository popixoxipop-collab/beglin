name: QT First Logit Divergence + Role Isolation (Frozen)

on:
  push:
    branches:
      - experiment/qt-first-logit-role-20261008
    paths:
      - .github/workflows/qt-first-logit-role.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-first-logit-role-20261008
  cancel-in-progress: false

jobs:
  qt-logit-role:
    runs-on: [self-hosted, macOS, ARM64, xox]
    timeout-minutes: 70
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact diagnostic fixtures and XOX host
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "XOX.local"
          test "$(id -un)" = "xox"
          test "$(shasum -a 256 tools/qt_logit_diag_build.py | awk '{print $1}')" = "81fe92f41dd0ed6d16d200ea409c449e4676d7531271f4aeead15467f7ea9814"
          test "$(shasum -a 256 tools/qt_logit_role_attribution.py | awk '{print $1}')" = "91189b43808f43b8701a06bddb37779dcc46e9c6d6b42cfd769509e36a563e84"
          python3 -m py_compile tools/qt_logit_diag_build.py tools/qt_logit_role_attribution.py
          test -f /tmp/beglin-qt-l0-fp32-control/qwen_infer.c
          test -x /tmp/beglin-qt-l0-fp32-control/build-qt-l0-fp32/qwen_infer_gpu
          test -s /tmp/qt-l0-fp32-cache/model.safetensors
          test -s /tmp/qt-natural-vfocus-ciftt2c_/prompts/english-128.i32
          echo QT_LOGIT_EXPERIMENT_PINS_PASS

      - name: Build isolated gated greedy-logit instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/qt_logit_diag_build.py | tee "$RUNNER_TEMP/qt-logit-build.log"

      - name: Original-engine parity and Q K V O role attribution
        shell: bash
        run: |
          set -euo pipefail
          /Users/xox/.venv-vllm-metal/bin/python -u tools/qt_logit_role_attribution.py | tee "$RUNNER_TEMP/qt-logit-role.log"

      - name: Verify exact evidence receipt and copy to artifact
        shell: bash
        run: |
          set -euo pipefail
          /Users/xox/.venv-vllm-metal/bin/python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          lines=(root/'qt-logit-role.log').read_text().splitlines()
          hits=[x[len('QT_LOGIT_ROLE_RESULT='):] for x in lines if x.startswith('QT_LOGIT_ROLE_RESULT=')]
          assert len(hits)==1,'EXACTLY_ONE_ROLE_RECEIPT_REQUIRED'
          summary=json.loads(hits[0])
          assert summary['status']=='SUCCEEDED'
          assert summary['automatic_live_promotion'] is False
          receipt=summary['receipt']
          p=pathlib.Path(receipt['path']).resolve()
          allowed=pathlib.Path('/Users/xox/mcp-sandbox/tailnet-commander/qt-logit-role-results').resolve()
          assert p.parent==allowed and p.is_file()
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()==receipt['sha256']
          assert len(raw)==receipt['bytes']
          result=json.loads(raw)
          assert result['schema']=='beglin-qt-logit-first-divergence-role-isolation/1'
          assert result['automatic_live_promotion'] is False
          assert result['cases']['english-128']['first_divergence_index_zero_based']==0
          assert result['cases']['english-128']['q4_first_top1']==785
          assert result['cases']['english-128']['vfocus_first_top1']==6471
          for name in ('english-128','english-512','english-1024'):
              assert result['cases'][name]['instrumented_12step_generation_parity'] is True
          assert len(result['cases']['english-128']['isolated_role_arms'])==9
          dest=root/'QT_FIRST_LOGIT_ROLE_EVIDENCE.json'
          dest.write_bytes(raw)
          (root/'QT_FIRST_LOGIT_ROLE_SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print('QT_LOGIT_EVIDENCE_SHA256',receipt['sha256'])
          print('QT_LOGIT_FIRST_DIVERGENCE',result['cases']['english-128']['first_divergence_index_zero_based'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt-first-logit-role-20261008
          path: |
            ${{ runner.temp }}/qt-logit-build.log
            ${{ runner.temp }}/qt-logit-role.log
            ${{ runner.temp }}/QT_FIRST_LOGIT_ROLE_SUMMARY.json
            ${{ runner.temp }}/QT_FIRST_LOGIT_ROLE_EVIDENCE.json
          if-no-files-found: warn
          retention-days: 90
