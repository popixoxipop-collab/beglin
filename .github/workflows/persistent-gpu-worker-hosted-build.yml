name: Persistent GPU Worker Hosted Build

on:
  push:
    branches:
      - persistent-gpu-worker-20261002
    paths:
      - "qwen_infer.c"
      - ".github/workflows/persistent-gpu-worker-hosted-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify arm64 runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          sw_vers

      - name: Install MLX
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install mlx
          python3 - <<'PY'
          import mlx, os
          print(os.path.join(list(mlx.__path__)[0], "share", "cmake"))
          PY

      - name: Build persistent qwen_infer_gpu
        run: |
          set -euo pipefail
          MLX_CMAKE_DIR="$(python3 - <<'PY'
          import mlx, os
          print(os.path.join(list(mlx.__path__)[0], "share", "cmake"))
          PY
          )"
          cmake -S . -B build-gpu-persistent             -DCMAKE_BUILD_TYPE=Release             -DMLX_CMAKE_DIR="$MLX_CMAKE_DIR"             -DCMAKE_BUILD_RPATH=/Users/xox/.venv-vllm-metal/lib/python3.12/site-packages/mlx/lib
          cmake --build build-gpu-persistent --target qwen_infer_gpu -j 3
          file build-gpu-persistent/qwen_infer_gpu
          /usr/bin/shasum -a 256 build-gpu-persistent/qwen_infer_gpu             | tee persistent_binary.sha256
          chmod 0755 build-gpu-persistent/qwen_infer_gpu
          tar -czf beglin-persistent-gpu-worker-arm64.tar.gz             -C build-gpu-persistent qwen_infer_gpu

      - uses: actions/upload-artifact@v4
        with:
          name: beglin-persistent-gpu-worker-arm64
          path: |
            beglin-persistent-gpu-worker-arm64.tar.gz
            persistent_binary.sha256
          if-no-files-found: error
          retention-days: 30
