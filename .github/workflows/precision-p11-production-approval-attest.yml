name: P11 Production Approval Attestation

on:
  push:
    branches:
      - precision-p11-production-approval-v1-20261004
    paths:
      - "attestations/BEGLIN_PRECISION_P11_PRODUCTION_APPROVAL_2026-10-04.json"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact P11 production approval
        shell: bash
        env:
          EXPECTED_ACTOR: popixoxipop-collab
          EXPECTED_ACTOR_ID: "261965176"
          EXPECTED_REQUEST_SHA: c82b1fec0cf43f5caae0753d23c04e0eb6655325eb04ce65eec35bc0cf8cf682
          EXPECTED_PLAN_SHA: 5e05d76c39eecbe0e1f6cff56fddb9750c70886a8c43aed513c57bc2d7fa1d58
          EXPECTED_PREIMAGE_SHA: 3e5fb94a461ad295fec7a6263b15cac53ebafb0bfc2148c03449194920d849d3
          EXPECTED_P10_SHA: 9c9c809097d18d735855f09bd85016272a319087501d160873f52985669f2fff
          EXPECTED_ROUTE_GENERATION: "6"
          EXPECTED_ROUTE_MANIFEST_SHA: c2bf7eed2788e115af0c0cb3316fceb061000013b2bfcf57710f66d291ff4221
          EXPECTED_WORKER_PID: "35493"
          EXPECTED_WEIGHT_EPOCH: "10"
          EXPECTED_ACK_SHA: c4a984463fdf75cbe83246c1128e7164faea0076a7f9113dbade21fff359f615
          EXPECTED_CANDIDATE_POLICY_SHA: b58064ae93c3550c5ca5fccab83c9976268370d559b8602f3d91772cb9ac82bd
          EXPECTED_EXECUTOR_SHA: b6c38337307672b3cc764a7d4b6e062c393fcdc30f0affa179714efa1b00a25d
          EXPECTED_COMPAT_SHA: 026c88a3ba39f4cada099b09583c6fc0a8d440a1c38a4348a87844d99f513958
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone, timedelta
          import json
          import os
          from pathlib import Path

          path = Path("attestations/BEGLIN_PRECISION_P11_PRODUCTION_APPROVAL_2026-10-04.json")
          obj = json.loads(path.read_text())
          actor = os.environ["GITHUB_ACTOR"]
          actor_id = os.environ.get("GITHUB_ACTOR_ID", "")

          assert actor == os.environ["EXPECTED_ACTOR"]
          if actor_id:
              assert actor_id == os.environ["EXPECTED_ACTOR_ID"]

          assert obj["schema"] == "beglin-precision-p11-production-approval-v1"
          assert obj["status"] == "VERIFIED_GITHUB_OIDC"
          assert obj["approver"]["github_login"] == actor
          assert int(obj["approver"]["github_user_id"]) == int(os.environ["EXPECTED_ACTOR_ID"])

          assert obj["approval_request_sha256"] == os.environ["EXPECTED_REQUEST_SHA"]
          assert obj["cutover_plan_sha256"] == os.environ["EXPECTED_PLAN_SHA"]
          assert obj["preimage_sha256"] == os.environ["EXPECTED_PREIMAGE_SHA"]
          assert obj["p10_result_sha256"] == os.environ["EXPECTED_P10_SHA"]
          assert int(obj["route_generation"]) == int(os.environ["EXPECTED_ROUTE_GENERATION"])
          assert obj["route_manifest_sha256"] == os.environ["EXPECTED_ROUTE_MANIFEST_SHA"]
          assert int(obj["worker_pid"]) == int(os.environ["EXPECTED_WORKER_PID"])
          assert int(obj["weight_epoch"]) == int(os.environ["EXPECTED_WEIGHT_EPOCH"])
          assert obj["ack_sha256"] == os.environ["EXPECTED_ACK_SHA"]
          assert obj["candidate_policy_hash"] == os.environ["EXPECTED_CANDIDATE_POLICY_SHA"]
          assert obj["executor_source_sha256"] == os.environ["EXPECTED_EXECUTOR_SHA"]
          assert obj["production_binary_rebind_compat_sha256"] == os.environ["EXPECTED_COMPAT_SHA"]

          assert obj["one_shot_precision_cutover_allowed"] is True
          assert obj["automatic_live_promotion"] is False
          assert obj["external_network_exposed"] is False
          assert isinstance(obj["nonce"], str) and obj["nonce"]

          issued = datetime.fromisoformat(obj["issued_at"].replace("Z", "+00:00")).astimezone(timezone.utc)
          expires = datetime.fromisoformat(obj["expires_at"].replace("Z", "+00:00")).astimezone(timezone.utc)
          now = datetime.now(timezone.utc)
          assert issued <= now < expires
          assert expires > issued
          assert expires - issued <= timedelta(minutes=30)

          print(json.dumps({
              "status": "VERIFIED",
              "actor": actor,
              "cutover_plan_sha256": obj["cutover_plan_sha256"],
              "preimage_sha256": obj["preimage_sha256"],
              "worker_pid": obj["worker_pid"],
              "weight_epoch": obj["weight_epoch"],
          }, sort_keys=True))
          PY

      - name: Publish GitHub OIDC provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: attestations/BEGLIN_PRECISION_P11_PRODUCTION_APPROVAL_2026-10-04.json
