name: Beglin Hierarchical MoE Real Rank Ablation XOX Readonly
on:
  push:
    branches: [research/hierarchical-tupper-moe-20261013]
    paths:
      - ".github/workflows/beglin-hierarchical-rank-ablation-xox.yml"
      - "experiments/hierarchical_tupper_moe/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beglin-hierarchical-xox-real-checkpoint
  cancel-in-progress: false
jobs:
  readonly-real-weights:
    runs-on: [self-hosted, xox, macOS, ARM64, virtual-character]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert real XOX host and local checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "XOX.local"
          test "$(id -un)" = "xox"
          INDEX=/Users/xox/vdsp_local_data/deepseek_v2lite_bf16_safetensors/model.safetensors.index.json
          test -f "$INDEX"
          test ! -L "$INDEX"
          if [ -x /Users/xox/.venv-vllm-metal/bin/python3 ] && /Users/xox/.venv-vllm-metal/bin/python3 -c 'import numpy' 2>/dev/null; then
            PYBIN=/Users/xox/.venv-vllm-metal/bin/python3
          elif python3 -c 'import numpy' 2>/dev/null; then
            PYBIN="$(command -v python3)"
          else
            echo "BLOCKED: preinstalled NumPy interpreter missing; no environment modification" >&2
            exit 2
          fi
          echo "PYBIN=$PYBIN" >> "$GITHUB_ENV"
          echo "INDEX=$INDEX" >> "$GITHUB_ENV"
          echo "SCRATCH=$RUNNER_TEMP/beglin-hierarchical-rank-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/beglin-hierarchical-rank-$GITHUB_RUN_ID"
          "$PYBIN" - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path("/Users/xox/vdsp_local_data/deepseek_v2lite_bf16_safetensors/model.safetensors.index.json")
          m=json.loads(p.read_text())["weight_map"]
          keys=[f"model.layers.1.mlp.experts.{e}.{r}.weight" for e in range(64) for r in ("gate_proj","up_proj","down_proj")]
          assert all(k in m for k in keys),"BLOCKED: expected unfused expert keys absent"
          print("REAL_INDEX_SHA256",hashlib.sha256(p.read_bytes()).hexdigest(),"SELECTED_SHARDS",len(set(m[k] for k in keys)))
          print("CHECKPOINT_FULL_SHA_NOT_VERIFIED")
          PY
      - name: Run 11+ tests without installing packages
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/hierarchical_tupper_moe
          OPENBLAS_NUM_THREADS=1 "$PYBIN" -m unittest discover -v
      - name: Content-hash selected local checkpoint shards
        shell: bash
        run: |
          set -euo pipefail
          "$PYBIN" - <<'PY'
          import hashlib,json,os,pathlib
          idx=pathlib.Path(os.environ["INDEX"])
          root=idx.resolve().parent
          meta=json.loads(idx.read_text())["weight_map"]
          names=sorted({meta[f"model.layers.1.mlp.experts.{e}.{r}.weight"] for e in range(64) for r in ("gate_proj","up_proj","down_proj")})
          records=[]
          for name in names:
              p=(root/name).resolve(strict=True)
              assert p.is_relative_to(root) and p.is_file() and not p.is_symlink()
              a=p.stat()
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda:f.read(8*1024*1024),b""):
                      h.update(b)
              z=p.stat()
              assert (a.st_dev,a.st_ino,a.st_size,a.st_mtime_ns,a.st_ctime_ns)==(z.st_dev,z.st_ino,z.st_size,z.st_mtime_ns,z.st_ctime_ns),"Shard changed during hash"
              records.append({"basename":p.name,"size_bytes":a.st_size,"sha256":h.hexdigest()})
          out={"schema":"beglin-selected-shards-readonly-v1","index_sha256":hashlib.sha256(idx.read_bytes()).hexdigest(),"selected_shards_sha256":records,"verified_selected_shard_content":True,"full_checkpoint_verified":False,"expert_count":64}
          target=pathlib.Path(os.environ["SCRATCH"])/"selected_shards.json"
          target.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("SELECTED_SHARD_HASH_PASS",len(records),out["index_sha256"])
          PY
      - name: Train-48 rank-2/8/16 heldout-16 ablations on all 1408 intermediate rows
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/hierarchical_tupper_moe
          for RANK in 2 8 16; do
            OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 nice -n 10 "$PYBIN" hierarchical_moe_probe.py \
              --checkpoint-index "$INDEX" --layer 1 --experts 64 --train-experts 48 \
              --rank "$RANK" --top-k 6 --hidden 2048 --intermediate 1408 \
              --groups 16 64 --output "$SCRATCH/real_64e_rank$RANK.json"
          done
      - name: Print quantitative rank contrast
        shell: bash
        run: |
          set -euo pipefail
          "$PYBIN" - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["SCRATCH"])
          for r in (2,8,16):
              d=json.loads((root/f"real_64e_rank{r}.json").read_text())
              assert d["all_rows_processed"] and d["source"]["type"]=="REAL_CHECKPOINT_PARTIAL_IDENTITY"
              for w in ("16","64"):
                  v=d["widths"][w]
                  print("RANK_CONTRAST",json.dumps({"rank":r,"width":int(w),
                    "explained_vs_shared_mean_mse":v["metric_explained_vs_shared_mean_mse"],
                    "q2_vs_q4_sq_error":v["full_tested_weight_hybrid_q2_squared_error"]/v["full_tested_weight_q4_squared_error"],
                    "storage_hybrid_over_q4":v["storage_full_layer_projection"]["hybrid_over_q4"],
                    "sparse_half_l2":v["routing"]["0.5"]["static_calibration_relative_l2"]},sort_keys=True))
          PY
      - name: Seal safe evidence metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SCRATCH:-}" ] || [ ! -d "$SCRATCH" ]; then exit 0; fi
          "$PYBIN" - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['SCRATCH'])
          files={x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in sorted(p.glob("*.json"))}
          receipt={"schema":"beglin-xox-hierarchical-real-v1","files_sha256":files,"source_head":os.getenv("GITHUB_SHA"),"full_checkpoint_content_verified":False,"actual_hidden_activations_verified":False,"production_touched":False,"promotion_allowed":False,"interpretation":"real weights, synthetic hidden vectors; not task-quality evidence"}
          (p/"receipt.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beglin-xox-real-rank-ablation
          path: ${{ runner.temp }}/beglin-hierarchical-${{ github.run_id }}/*.json
          if-no-files-found: warn
          retention-days: 30
