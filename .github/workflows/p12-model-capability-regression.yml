name: P12 Model Capability Regression

on:
  push:
    branches:
      - precision-p12-model-capability-v1-20261004
    paths:
      - ".github/workflows/p12-model-capability-regression.yml"
      - "schemas/model/**"
      - "tools/model_capability*.py"
      - "tools/model_evidence_registry.py"
      - "tools/backend_adapters_v2.py"
      - "tools/backend_execution_v2.py"
      - "tools/inspect_model.py"
      - "tools/p12_*.py"
      - "tools/test_model_capability*.py"
      - "tools/test_p12_*.py"
      - "attestations/BEGLIN_P12_*.json"
      - "package.json"
      - "scripts/test-package-source-closure.js"
      - "CMakeLists.txt"
      - "safetensors_*.c"
      - "safetensors_*.h"
      - "qwen_infer.c"
  pull_request:
    branches:
      - main
    paths:
      - "schemas/model/**"
      - "tools/model_capability*.py"
      - "tools/model_evidence_registry.py"
      - "tools/backend_adapters_v2.py"
      - "tools/backend_execution_v2.py"
      - "tools/inspect_model.py"
      - "tools/p12_*.py"
      - "tools/test_model_capability*.py"
      - "tools/test_p12_*.py"
      - "attestations/BEGLIN_P12_*.json"
      - "package.json"
      - "scripts/test-package-source-closure.js"
      - "CMakeLists.txt"
      - "safetensors_*.c"
      - "safetensors_*.h"
      - "qwen_infer.c"

permissions:
  contents: read

jobs:
  p12-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile P12 Python modules
        run: |
          python -m py_compile             tools/model_capability.py             tools/model_capability_bridge.py             tools/model_evidence_registry.py             tools/backend_adapters_v2.py             tools/backend_execution_v2.py             tools/inspect_model.py             tools/p12_pipeline_bridge.py             tools/p12_capability_acceptance.py
          python -m compileall -q tools

      - name: Verify BSKEL contracts
        run: python tools/verify_model_contracts.py

      - name: Run targeted P12 tests
        env:
          PYTHONPATH: tools
        run: |
          python -m unittest -v             tools/test_model_capability.py             tools/test_model_capability_p12.py             tools/test_model_capability_bridge_p12.py             tools/test_p12_pipeline_bridge.py             tools/test_p12_runtime_adapter.py             tools/test_p12_capability_acceptance.py

      - name: Run full Python regression
        env:
          PYTHONPATH: tools
        run: python -m unittest discover -s tools -p 'test_*.py'

      - name: Package source closure
        run: npm run test:package-source-closure

      # test:package-failure-fixtures asserts Darwin-native failure modes
      # (clang/link behavior). On the hosted Linux runner the package
      # intentionally returns SKIP_UNSUPPORTED, so those fixtures are kept
      # in the macOS/native acceptance path rather than misclassified here.
      - name: Package cold install
        run: npm run test:package-cold-install

      - name: CMake syntax guard
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*//' CMakeLists.txt; then
            echo "CMakeLists.txt contains C++-style comments"
            exit 1
          fi

      - name: Diff check
        run: git diff --check
