name: JE01 official BF16 SHA revision identity history (readonly)
on:
  push:
    branches: [research/je01-moe-bayesian-bit-allocation-20261117]
    paths:
      - 'tools/je01_hf_source_revision_identity_audit.py'
      - '.github/workflows/je01-hf-source-revision-audit.yml'
permissions:
  contents: read
jobs:
  verify-old-source-revisions:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 requests==2.32.3
      - name: Compare EOE-original BF16 shard full-SHA across official revisions
        run: |
          set -euo pipefail
          python tools/je01_hf_source_revision_identity_audit.py \
            | tee "$RUNNER_TEMP/je01_revision_audit_logs.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: je01-bf16-source-revision-identity
          path: |
            JE01_HF_REVISION_IDENTITY_READONLY_AUDIT.json
            ${{ runner.temp }}/je01_revision_audit_logs.txt
          retention-days: 14
          if-no-files-found: error
